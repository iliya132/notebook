spring:
  application:
    name: notebook
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notebook}
    username: ${SPRING_DATASOURCE_USERNAME:notebook}
    password: ${DB_PASSWORD:notebook}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      "[hibernate.generate_statistics]": true
      "[hibernate.session.events.log]": false
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
    timeout: 7d
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.data.repository.invocations: true
      slo:
        http.server.requests: 25ms,50ms,100ms,250ms,500ms,1s,2s,5s
        spring.data.repository.invocations: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
